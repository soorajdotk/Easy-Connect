<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Universal Remote Agent</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    .card {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 24px;
      text-align: center;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3), 0 8px 10px -6px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(12px);
      max-width: 320px;
      width: 90%;
    }
    h1 {
      font-size: 1.5rem;
      margin: 0 0 8px 0;
      background: linear-gradient(to right, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .status {
      font-size: 0.875rem;
      color: #94a3b8;
      margin-bottom: 20px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      justify-content: center;
      width: 100%;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ef4444; /* Default disconnected */
    }
    .status-dot.connected {
      background: #22c55e;
      box-shadow: 0 0 8px #22c55e;
    }
    .status-dot.waiting {
      background: #f59e0b;
      box-shadow: 0 0 8px #f59e0b;
    }
    .qr-container {
      background: white;
      padding: 12px;
      border-radius: 12px;
      display: inline-block;
      margin-bottom: 16px;
    }
    #qr-image {
      width: 200px;
      height: 200px;
      display: block;
    }
    .instructions {
      font-size: 0.8125rem;
      color: #64748b;
      line-height: 1.4;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Universal Remote</h1>
    <div class="status">
      <span class="status-dot" id="status-dot"></span>
      <span id="status-text">Initializing...</span>
    </div>
    <div class="qr-container">
      <img id="qr-image" src="" alt="Pairing QR Code" />
    </div>
    <p class="instructions">Scan this QR code from the Web Client to pair and control this computer.</p>
  </div>

  <script>
    window.electronAPI.onUpdatePairing((dataUrl) => {
      document.getElementById('qr-image').src = dataUrl;
    });

    window.electronAPI.onUpdateStatus((status) => {
      const dot = document.getElementById('status-dot');
      const text = document.getElementById('status-text');
      text.innerText = status;
      
      dot.className = 'status-dot';
      if (status === 'Connected') {
        dot.classList.add('connected');
      } else if (status === 'Disconnected' || status === 'Pairing Expired') {
        dot.classList.add('disconnected');
      } else {
        dot.classList.add('waiting');
      }
    });
  </script>
</body>
</html>
